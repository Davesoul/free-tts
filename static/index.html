<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>free-tts</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#ffff88;color:#000000;
    font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
  body{background-color:#ffff88}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:920px;margin:0 auto;padding:30px 20px 60px;
    border:3px solid #000000;border-radius:8px;
    background:#ffffff;color:#000000}
  h1{font-size:40px;margin:0 0 12px;letter-spacing:.3px;color:#000000;font-weight:bold}
  .sub{color:#333333;margin-bottom:28px;font-size:18px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .grow{flex:1 1 auto;min-width:160px}
  label{display:block;font-size:14px;color:#000000;margin:8px 0 4px;font-weight:bold}
  input[type=text],select,textarea{
    width:100%;background:#ffffff;border:2px solid #000000;border-radius:6px;
    padding:10px 12px;outline:none;color:#000000;font-size:14px}
  textarea{resize:vertical;min-height:80px}
  .btn{
    background:#0055ff;color:#ffffff;border:none;border-radius:6px;
    padding:12px 20px;font-weight:600;font-size:16px}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;border:2px solid #000000;color:#000000}
  .btn.ghost:hover{border-color:#ff0000;color:#ff0000}
  .btn.danger{background:#cc0000;color:#ffffff}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .panel{background:#ffffff;border:2px solid #000000;border-radius:10px;padding:20px;margin-top:20px}
  .row.stacked{gap:12px}
  .status{font-size:14px;color:#000000;margin-top:12px;min-height:20px}
  .status.ok{color:#008800} .status.bad{color:#cc0000}
  .audiobar{margin-top:16px}
  .audiobar audio{width:100%;height:48px;border-radius:6px;background:#cccccc}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
  .hint{font-size:14px;color:#333333}
  .hidden{display:none!important}
  #log{font-size:14px;color:#333333;margin-top:12px;max-height:140px;overflow:auto;
    background:#eeeeee;border:2px solid #000000;border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
  .filelist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .fileitem{display:flex;gap:10px;align-items:center;justify-content:space-between;
    background:#eeeeee;border:2px solid #000000;border-radius:6px;padding:8px 10px;font-size:14px;color:#000000}
  .fileitem a{color:#0055ff;text-decoration:none;font-weight:bold}
  .fileitem a:hover{text-decoration:underline}
  .recording{display:none;align-items:center;gap:10px;color:#cc0000;font-weight:600;margin-top:10px;font-size:14px}
  .recording.on{display:flex}
  .dot{width:12px;height:12px;border-radius:50%;background:#cc0000}
  .progress{display:none;align-items:center;gap:10px;margin-top:10px}
  .progress.on{display:flex}
  .spinner{width:16px;height:16px;border:2px solid #000000;border-top-color:#0055ff}
  .captions{border:2px solid #000000;border-radius:8px;background:#ffffff;
    margin-top:12px;max-height:200px;overflow:auto;font-size:14px;color:#000000}
  .cap-entry{padding:8px 10px;border-bottom:1px solid #000000}
  .cap-entry:last-child{border-bottom:none}
  .cap-entry .cap-time{color:#333333;font-size:13px;margin-bottom:4px}
  .cap-entry .cap-text{color:#000000}
  .cap-entry.active{background:#ffddaa;border-left:4px solid #0055ff;padding-left:8px;margin-left:-12px}
  .cap-empty{color:#666666;font-style:italic;text-align:center;padding:16px;font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1 style="color:#000000">free-tts</h1>
  <div class="sub" style="color:#333333">local TTS + voice cloning · save MP3 · play in browser · CLI: python tts.py …</div>

  <div class="row stacked">
    <div class="grow">
      <label for="text" style="color:#000000">Text</label>
      <textarea id="text" placeholder="Type or paste text here…" style="background:#ffffff;color:#000000;border:2px solid #000000">Hello world, this is a quick test of free-tts.</textarea>
    </div>
  </div>

  <div class="row stacked">
    <div style="flex:2 1 auto;min-width:200px">
      <label for="engine" style="color:#000000">Engine</label>
      <select id="engine" style="background:#ffffff;color:#000000;border:2px solid #000000">
        <option value="auto" style="background:#ffffff;color:#000000">auto (kokoro, then clone if ref)</option>
        <option value="kokoro" style="background:#ffffff;color:#000000">kokoro</option>
        <option value="coqui-clone" style="background:#ffffff;color:#000000">coqui-clone (voice cloning)</option>
        <option value="espeak-ng" style="background:#ffffff;color:#000000">espeak-ng</option>
      </select>
    </div>
    <div style="flex:2 1 auto;min-width:160px">
      <label for="voice" style="color:#000000">Voice (kokoro)</label>
      <select id="voice" style="background:#ffffff;color:#000000;border:2px solid #000000"></select>
    </div>
    <div style="flex:1 1 auto;min-width:120px">
      <label for="lang" style="color:#000000">Language</label>
      <select id="lang" style="background:#ffffff;color:#000000;border:2px solid #000000">
        <option value="en" style="background:#ffffff;color:#000000">en</option>
        <option value="en-us" style="background:#ffffff;color:#000000">en-us</option>
        <option value="fr" style="background:#ffffff;color:#000000">fr</option>
        <option value="de" style="background:#ffffff;color:#000000">de</option>
        <option value="es" style="background:#ffffff;color:#000000">es</option>
        <option value="it" style="background:#ffffff;color:#000000">it</option>
        <option value="pt" style="background:#ffffff;color:#000000">pt</option>
        <option value="ja" style="background:#ffffff;color:#000000">ja</option>
        <option value="zh" style="background:#ffffff;color:#000000">zh</option>
      </select>
    </div>
  </div>

  <div class="panel">
    <div class="row stacked">
      <div>
        <label for="refPath" style="color:#000000">Reference audio (for cloning)</label>
        <div class="row">
          <input type="text" id="refPath" placeholder="none — record or upload below" disabled style="flex:2 1 auto;background:#ffffff;color:#333333;border:2px solid #000000;font-size:14px" />
          <button class="btn ghost" id="uploadBtn" style="background:transparent;border:2px solid #000000;color:#000000;padding:12px 20px;font-size:16px">Upload</button>
          <input type="file" id="uploadInput" accept=".wav,.mp3,.mp4,.webm,.ogg,.flac" class="hidden" />
        </div>
      </div>
    </div>

    <div class="row" style="margin-top:12px">
      <button class="btn ghost" id="recordBtn" style="background:transparent;border:2px solid #000000;color:#000000;padding:12px 20px;font-size:16px">Record</button>
    </div>
    <div class="recording" id="recording">
      <span class="dot"></span> Recording… speak clearly, then press Stop.
      <button class="btn danger" id="stopRecBtn" style="margin-left:12px;background:#cc0000;color:#ffffff;padding:12px 20px;font-size:16px">Stop</button>
    </div>
    <div class="progress" id="progress">
      <span class="spinner"></span><span id="progressText" style="color:#000000;font-size:14px">Generating…</span>
    </div>
    <div class="hint" style="color:#333333">Allow microphone when prompted. The recording is saved locally and used as the voice-cloning reference.</div>
    <div class="row" style="margin-top:10px;align-items:center;gap:12px">
      <input type="checkbox" id="cleanRef" style="accent-color:#0055ff;width:20px;height:20px" />
      <label for="cleanRef" style="font-size:14px;color:#000000;margin:0;font-weight:bold">Clean audio (denoise + normalize + trim silence) — takes a few seconds</label>
    </div>
  </div>

  <div class="row" style="margin-top:20px">
    <button class="btn" id="runBtn" style="background:#0055ff;color:#ffffff;padding:12px 24px;font-size:18px">Generate</button>
    <span class="status" id="status"></span>
  </div>

  <div class="audiobar hidden" id="audiobar">
    <audio id="player" controls style="display:block;width:100%"></audio>
    <div class="actions">
      <a id="downloadLink" class="btn ghost" download style="background:transparent;border:2px solid #000000;color:#000000;padding:12px 20px;font-size:16px">Download MP3</a>
      <button class="btn ghost" id="playBtn" style="background:transparent;border:2px solid #000000;color:#000000;padding:12px 20px;font-size:16px">Play</button>
      <button class="btn ghost" id="stopBtn" style="background:transparent;border:2px solid #000000;color:#000000;padding:12px 20px;font-size:16px">Stop</button>
      <button class="btn ghost" id="clearBtn" style="background:transparent;border:2px solid #000000;color:#000000;padding:12px 20px;font-size:16px">Clear</button>
    </div>
    <div class="captions" id="captions">
      <div class="captions-header" style="font-size:14px;color:#333333;margin-bottom:10px">Captions</div>
      <div class="captions-body" id="captionsBody">
        <div class="cap-empty">No captions yet</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <div style="font-size:14px;color:#333333;margin-right:14px">Recent files</div>
      <button class="btn ghost" id="refreshFilesBtn" style="margin-left:auto;background:transparent;border:2px solid #000000;color:#000000;padding:12px 20px;font-size:16px">Refresh</button>
    </div>
    <div class="filelist" id="filelist"></div>
  </div>

  <div id="log"></div>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var OUT_DIR='/api/files';
  var log=document.getElementById('log');
  function L(m){if(log){log.textContent=(log.textContent+'\n'+m).slice(-2500);log.scrollTop=log.scrollHeight;}}
  async function api(path,opts){
    var r=fetch(path,opts);
    var j=r.then(function(res){return res.text()});
    var p=j.then(function(t){try{return JSON.parse(t)}catch(e){return {error:'response not JSON',body:t}}});
    return p.then(function(x){
      if(x.error==='response not JSON'){L('Server error (not JSON): '+(x.body||'').slice(0,600));return x;}
      return x;
    })
  }
  var engine=$('#engine'),voice=$('#voice'),lang=$('#lang'),
    text=$('#text'),status=$('#status'),refPath=$('#refPath'),
    runBtn=$('#runBtn'),recording=$('#recording'),recHint=$('#recHint'),
    recordBtn=$('#recordBtn'),stopRecBtn=$('#stopRecBtn'),
    uploadBtn=$('#uploadBtn'),uploadInput=$('#uploadInput'),
    progress=$('#progress'),progressText=$('#progressText'),
    audiobar=$('#audiobar'),player=$('#player'),downloadLink=$('#downloadLink'),
    playBtn=$('#playBtn'),stopBtn=$('#stopBtn'),clearBtn=$('#clearBtn'),
    filelist=$('#filelist'),refreshFilesBtn=$('#refreshFilesBtn');
  var voices=[];
  voice.innerHTML='<option value="af_sarah">loading voices…</option>';
  (async function(){
    try{
      var j=await api('/api/voices');
      if(j.voices&&j.voices.length){voices=j.voices;
        voice.innerHTML=voices.map(function(v){return '<option value="'+v+'">'+v+'</option>'}).join('')}
      else{voice.innerHTML='<option value="af_sarah">af_sarah (default)</option>'}
    }catch(e){L('voice probe failed: '+e); voice.innerHTML='<option value="af_sarah">af_sarah</option>'}
  })();
  function setStatus(m,ok){if(status){status.textContent=m;status.className='status'+(ok?' ok':(m?' bad':''))}}
  function setRunning(on){
    if(runBtn)runBtn.disabled=on;
    if(recordBtn)recordBtn.disabled=on;
    if(uploadBtn)uploadBtn.disabled=on;
    if(engine)engine.disabled=on;
    if(lang)lang.disabled=on;
    if(text)text.disabled=on;
  }
  function setProgress(on,txt){
    if(progress)progress.classList.toggle('on',on);
    if(progressText)progressText.textContent=txt||'';
  }
  recordBtn.addEventListener('click',async function(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      setStatus('Microphone API not available in this browser.','');return}
    try{
      var stream=await navigator.mediaDevices.getUserMedia({audio:true});
      var mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')? 'audio/webm;codecs=opus':
                 MediaRecorder.isTypeSupported('audio/webm')? 'audio/webm':
                 MediaRecorder.isTypeSupported('audio/ogg')? 'audio/ogg':'audio/mp3';
      mediaRecorder=new MediaRecorder(stream, mime&&{mimeType:mime});
      recordedChunks=[]; recordedBlob=null;
      mediaRecorder.ondataavailable=function(e){if(e.data.size>0)recordedChunks.push(e.data)};
      mediaRecorder.onstop=function(){
        recordedBlob=new Blob(recordedChunks,{type:mime||'audio/webm'});
        recording.classList.remove('on');stream.getTracks().forEach(function(t){t.stop()});
        L('Recording saved locally. Uploading to server…');
        var reader=new FileReader();
        reader.onload=function(){
          api('/api/record',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({audio_b64:reader.result.split(',',2)[1]||reader.result, clean: $('#cleanRef').checked})}).then(function(j){
              if(j.path){var name=(j.path.split('\\\\').pop()||j.path).split('/').pop()||j.path;if(refPath)refPath.value=name;
                L('Reference saved: '+name);setStatus('Reference ready. Generate to use it.','ok')}
              else L('Reference save failed: '+(j.error||'?'));});
        };
        reader.readAsDataURL(recordedBlob);
      };
      mediaRecorder.start();
      recording.classList.add('on');if(recHint)recHint.textContent='Recording… speak now, then press Stop.';
      L('Recording started (format: '+mime+'). Press Stop when done.');
    }catch(e){
      L('Record error: '+e);setStatus('Microphone error.','');recording.classList.remove('on')}
  });
  stopRecBtn.addEventListener('click',function(){
    if(mediaRecorder&&mediaRecorder.state!=='inactive'){
      mediaRecorder.stop();
      if(recHint)recHint.textContent='Saving…';
      setTimeout(function(){if(!recordedBlob){L('No recorded blob.');if(recHint)recHint.textContent='Recording failed.'}},300)
    }
  });
  uploadBtn.addEventListener('click',function(){if(uploadInput)uploadInput.click()});
  if(uploadInput)uploadInput.addEventListener('change',async function(){
    var f=uploadInput.files[0]; if(!f)return;
    var fd=new FormData(); fd.append('file',f);
    if($('#cleanRef').checked) fd.append('clean','1');
    try{
      setProgress(true,'Uploading…');
      var j=await api('/api/upload',{method:'POST',body:fd});
      setProgress(false,'');
      if(j.path){var name=(j.path.split('\\\\').pop()||j.path).split('/').pop()||j.path;if(refPath)refPath.value=name;
        L('Reference uploaded: '+name);setStatus('Reference ready: '+name,'ok')}
      else setStatus('Upload failed.','')
    }catch(e){setProgress(false,'');setStatus('Upload error.','')}
    uploadInput.value=''});
  runBtn.addEventListener('click',async function(){
    var t=text.value.trim();
    if(!t){setStatus('Enter some text.','');return}
    var e=engine.value, v=voice.value, l=lang.value;
    var ref=refPath.value? (OUT_DIR+'/'+refPath.value) : null;
    setStatus('Generating…','');setRunning(true);setProgress(true,'Generating…');
    if(audiobar)audiobar.classList.add('hidden');
    try{
      var body={text:t,engine:e,voice:v,lang:l};
      if(e==='coqui-clone'&&ref)body.ref=ref;
      setProgress(true,'Generating…');
      var j=await fetch('/api/generate',{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      var r=await j.json();
      setProgress(false,'');
      if(!j.ok){L('Generate error: '+(r.error||'?')+'\\n'+(r.stderr||''));setStatus('Error.','')}
      else{
        var name=r.file.name;
        L('Generated: '+name+' ('+r.file.size+' bytes)');
        setStatus('Done — '+name,'ok');
        if(player)player.src='/api/files/'+encodeURIComponent(name);
        if(downloadLink)downloadLink.href='/api/files/'+encodeURIComponent(name);
        if(downloadLink)downloadLink.download=name;
        if(audiobar)audiobar.classList.remove('hidden');
        if(r.captions&&r.captions.path){
          var srtName=r.captions.name;
          var capLink=document.createElement('a');
          capLink.href='/api/files/'+encodeURIComponent(srtName);
          capLink.download=srtName;
          capLink.textContent='Download captions (.srt)';
          capLink.className='btn ghost';
          L('Captions: '+srtName+' ('+r.captions.size+' bytes) — import to CapCut/subtitle apps');
          var actions=document.querySelector('.actions');
          if(actions){actions.appendChild(capLink)}
        }
        refreshFileList();
        if(r.captions&&r.captions.path){
          try{
            var srtRes=await fetch('/api/files/'+encodeURIComponent(srtName));
            var srtText=await srtRes.text();
            var entries=parseSRT(srtText);
            renderTimeline(entries);
            L('Timeline: '+entries.length+' caption(s) shown');
          }catch(e){L('Timeline fetch error: '+e)}
        }
      }
    }catch(e){setProgress(false,'');L('Generate exception: '+e);setStatus('Error.','')}
    setRunning(false)
  });
  if(playBtn)playBtn.addEventListener('click',function(){if(player)player.play().catch(function(e){L('Play error: '+e)})});
  if(stopBtn)stopBtn.addEventListener('click',function(){if(player){player.pause();player.currentTime=0}});
  if(clearBtn)clearBtn.addEventListener('click',function(){if(player){player.pause();player.src='';}if(audiobar)audiobar.classList.add('hidden');setStatus('')});
  var capBodyEl=document.getElementById('captionsBody');
  function parseSRT(srtText){
    var entries=[];var blocks=srtText.trim().split(/\n\s*\n/);
    for(var i=0;i<blocks.length;i++){
      var block=blocks[i];
      var lines=block.split('\n').filter(function(l){return l.length>0});
      if(lines.length<3)continue;
      var idx2=parseInt(lines[0],10);
      if(isNaN(idx2))continue;
      var m=lines[1].match(/(\d{2}):(\d{2}):(\d{2}),(\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2}),(\d{3})/);
      if(!m)continue;
      var start=(+m[1])*3600+(+m[2])*60+(+m[3])+(m[4]/1000);
      var end=(+m[5])*3600+(+m[6])*60+(+m[7])+(m[8]/1000);
      entries.push({idx:idx2,start:start,end:end,text:lines.slice(2).join('\n')});
    }
    return entries;
  }
  function fmtDur(s){
    if(s<0)s=0;s=Math.floor(s*100)/100;
    var m=Math.floor((s%3600)/60),sec=(s%60).toFixed(2);
    var p=function(v){return String(v).padStart(2,'0')};
    return(p(m)+':'+p(sec));
  }
  function renderTimeline(entries){
    if(!capBodyEl)return;
    capBodyEl.innerHTML='';
    if(!entries||!entries.length){capBodyEl.innerHTML='<div class="cap-empty">No captions</div>';return}
    for(var i=0;i<entries.length;i++){
      var e=entries[i];
      var div=document.createElement('div');div.className='cap-entry';
      div.dataset.start=e.start;div.dataset.end=e.end;
      var t=document.createElement('div');t.className='cap-time';
      t.textContent=fmtDur(e.start)+' → '+fmtDur(e.end);
      var tx=document.createElement('div');tx.className='cap-text';tx.textContent=e.text;
      div.appendChild(t);div.appendChild(tx);
      capBodyEl.appendChild(div);
    }
  }
  function syncActiveCaption(){
    if(!capBodyEl||!capBodyEl.children.length)return;
    var first=capBodyEl.children[0];
    if(first.classList&&first.classList.contains('cap-empty'))return;
    var ct=player.currentTime||0;
    var active=null;
    Array.prototype.forEach.call(capBodyEl.children,function(el){
      var s=+el.dataset.start,e=+el.dataset.end;
      var on=ct>=s&&ct<e;
      el.classList.toggle('active',on);
      if(on)active=el;
    });
    if(active&&capBodyEl.scrollHeight>capBodyEl.clientHeight){
      var sc=active.offsetTop-((capBodyEl.clientHeight||300)/2)+active.clientHeight/2;
      capBodyEl.scrollTop=Math.max(0,sc);
    }
  }
  if(player){
    player.addEventListener('timeupdate',syncActiveCaption);
    player.addEventListener('play',syncActiveCaption);
    player.addEventListener('seeked',syncActiveCaption);
  }
  async function refreshFileList(){
    try{
      var res=await fetch('/api/files');var j=await res.json();
      if(filelist)filelist.innerHTML='';
      if(!j.files||!j.files.length){if(filelist)filelist.innerHTML='<div class="hint">No files yet.</div>';return}
      j.files.slice(0,60).forEach(function(f){
        var div=document.createElement('div');div.className='fileitem';
        var a=document.createElement('a');a.href='/api/files/'+encodeURIComponent(f.name);
        a.textContent=f.name+' ('+f.size+' b)';
        var del=document.createElement('button');del.className='btn ghost';
        del.textContent='Del';del.style.padding='4px 10px';del.style.fontSize='13px';
        del.onclick=function(){fetch('/api/files/'+encodeURIComponent(f.name),{method:'DELETE'}).then(function(){
          L('Deleted: '+f.name);refreshFileList();}).catch(function(e){L('Del error: '+e)});};
        div.appendChild(a);div.appendChild(del);if(filelist)filelist.appendChild(div)
      })
    }catch(e){L('file list error: '+e)}
  }
  if(refreshFilesBtn)refreshFilesBtn.addEventListener('click',refreshFileList);
  refreshFileList();
  L('ready. Type text, pick engine/voice, optionally record/upload a reference, then Generate.');
})();
</script>
</body>
</html>
